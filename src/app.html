<meta charset="utf-8">
<title></title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;700&family=IBM+Plex+Serif:wght@700&display=swap">
<style>
  :root {
    color-scheme: light;
    --bg: #E8ECF1;
    --surface: #F8FAFC;
    --ink: #131B25;
    --muted: #566376;
    --line: #C8D1DC;
    --accent: #1D5FC0;
    --accent-ink: #FFFFFF;
    --accent-soft: rgba(29, 95, 192, .12);
    --warn: #A84F06;
    --spring: #2E7A47;
    --summer: #BF3F0B;
    --autumn: #9A5A06;
    --winter: #2B5C9C;
    /* canvas */
    --space: #F4F6F9;
    --star: transparent;
    --ring: rgba(38, 58, 88, .16);
    --orbit: rgba(38, 58, 88, .42);
    --trail: #1D5FC0;
    --sun: #E0900A;
    --sun-glow: rgba(240, 160, 20, .38);
    --earth-day: #3A83E6;
    --earth-night: #172E4D;
    --moon: #7B4FD0;
    --moon-lit: #F3EEDF;
    --moon-dark: #4A4F5C;
    --grat: rgba(255, 255, 255, .38);
    --pole: #FFFFFF;
    --label: #5A677A;
    --label-strong: #17212D;
    --sector-a: rgba(29, 95, 192, .11);
    --sector-b: rgba(224, 144, 10, .14);
    --vel: #C2410C;
    --place: #E03558;

    --font-ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    /* For numerals. No generic family at the end: each use appends var(--font-ui) or monospace */
    --font-num: "IBM Plex Mono", ui-monospace, Consolas, "Courier New";
    --font-title: "IBM Plex Serif", Georgia, serif;
  }
  /*@LOCALE_CSS@*/
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #070B11;
      --surface: #0E151F;
      --ink: #E2E8F0;
      --muted: #8995A8;
      --line: #213043;
      --accent: #5C9BFF;
      --accent-ink: #061020;
      --accent-soft: rgba(92, 155, 255, .16);
      --warn: #F5A524;
      --spring: #6CCB8C;
      --summer: #FF8A4C;
      --autumn: #F0B04E;
      --winter: #7FAEFF;
      --space: #03060B;
      --star: rgba(205, 222, 255, .9);
      --ring: rgba(150, 175, 210, .15);
      --orbit: rgba(150, 175, 210, .42);
      --trail: #5C9BFF;
      --sun: #FFC23A;
      --sun-glow: rgba(255, 185, 50, .32);
      --earth-day: #5AA0FF;
      --earth-night: #122038;
      --moon: #BCA0FF;
      --moon-lit: #F1EAD6;
      --moon-dark: #2E3440;
      --grat: rgba(255, 255, 255, .32);
      --pole: #FFFFFF;
      --label: #8A97AA;
      --label-strong: #DDE5EF;
      --sector-a: rgba(92, 155, 255, .13);
      --sector-b: rgba(255, 194, 58, .11);
      --vel: #FF8A4C;
      --place: #FF5C7C;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #070B11;
    --surface: #0E151F;
    --ink: #E2E8F0;
    --muted: #8995A8;
    --line: #213043;
    --accent: #5C9BFF;
    --accent-ink: #061020;
    --accent-soft: rgba(92, 155, 255, .16);
    --warn: #F5A524;
    --spring: #6CCB8C;
    --summer: #FF8A4C;
    --autumn: #F0B04E;
    --winter: #7FAEFF;
    --space: #03060B;
    --star: rgba(205, 222, 255, .9);
    --ring: rgba(150, 175, 210, .15);
    --orbit: rgba(150, 175, 210, .42);
    --trail: #5C9BFF;
    --sun: #FFC23A;
    --sun-glow: rgba(255, 185, 50, .32);
    --earth-day: #5AA0FF;
    --earth-night: #122038;
    --moon: #BCA0FF;
    --moon-lit: #F1EAD6;
    --moon-dark: #2E3440;
    --grat: rgba(255, 255, 255, .32);
    --pole: #FFFFFF;
    --label: #8A97AA;
    --label-strong: #DDE5EF;
    --sector-a: rgba(92, 155, 255, .13);
    --sector-b: rgba(255, 194, 58, .11);
    --vel: #FF8A4C;
    --place: #FF5C7C;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-ui);
    font-size: 14px;
    line-height: 1.6;
    padding-inline: 16px;
    padding-block: 18px 32px;
  }
  .app {
    max-width: 1320px;
    margin-inline: auto;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 348px;
    gap: 14px 20px;
    align-items: start;
  }
  .masthead {
    grid-column: 1 / -1;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px 24px;
  }
  .titles { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 18px; min-width: 0; }
  h1 {
    font-family: var(--font-title);
    font-size: 28px;
    line-height: 1.3;
    letter-spacing: .01em;
    margin: 0;
    text-wrap: balance;
  }
  .titles p { margin: 0; color: var(--muted); max-width: 70ch; }
  .settings { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
  .setting { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
  .setting select { max-width: 16em; }
  .custom-place {
    grid-column: 1 / -1;
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 10px 14px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 16px;
  }
  .custom-place label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
  .custom-place input { width: 9em; }
  .custom-place .hint, .custom-place .error { flex-basis: 100%; margin: 0; }
  .error { color: var(--warn); font-size: 12.5px; }
  h2 {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .08em;
    color: var(--muted);
    margin: 0 0 8px;
  }
  .muted { color: var(--muted); }

  .main-col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

  /* stage: top = view from above; bottom = edge-on view sharing the same horizontal axis */
  .stage {
    display: flex;
    flex-direction: column;
    height: clamp(620px, calc(100vh - 110px), 1080px);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    background: var(--space);
  }
  .plan { position: relative; flex: 1 1 auto; min-height: 0; }
  .plan canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .elev { position: relative; flex: none; height: 200px; border-top: 1px dashed var(--line); }
  #side-canvas { display: block; width: 100%; height: 100%; }
  .stage-note {
    position: absolute;
    left: 12px;
    top: 10px;
    max-width: calc(100% - 24px);
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 5px;
    font-size: 12px;
    color: var(--muted);
    pointer-events: none;
  }
  .badge {
    display: inline-block;
    padding: 1px 9px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--surface);
    color: var(--ink);
    font-family: var(--font-num), var(--font-ui);
    font-size: 12px;
  }
  .badge.is-exaggerated, .badge.is-alert { color: var(--warn); border-color: var(--warn); }
  .stage-foot {
    position: absolute;
    right: 12px;
    bottom: 8px;
    font-size: 11px;
    color: var(--muted);
    pointer-events: none;
  }

  /* Edge-on view and straightened-orbit view */
  .view-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .view-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
  .view-head h2 { font-size: 15px; color: var(--ink); letter-spacing: .02em; margin: 0; margin-inline-end: auto; }
  .view-sub { margin: -4px 0 0; font-size: 12px; color: var(--muted); max-width: 88ch; }
  .side-foot {
    display: grid;
    grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr);
    gap: 12px 22px;
    align-items: start;
  }
  .side-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px; margin: 0; }
  .side-stats dt { font-size: 11.5px; color: var(--muted); }
  .side-stats dd { margin: 0; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .side-stats small { display: block; font-size: 11.5px; font-weight: 400; color: var(--muted); }
  #strip-canvas {
    display: block;
    width: 100%;
    height: 250px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--space);
    cursor: grab;
    touch-action: pan-y;
  }
  #strip-canvas:active { cursor: grabbing; }
  .strip-controls {
    display: grid;
    grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
    gap: 12px 22px;
    align-items: start;
  }
  .strip-options { display: flex; flex-direction: column; gap: 10px; }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; }
  .presets button { font-size: 12px; padding: 2px 10px; border-radius: 999px; }
  .presets button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
  .check { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; }
  .check input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
  .strip-note { margin: 0; font-size: 12.5px; color: var(--muted); max-width: 88ch; }

  /* panel */
  .panel { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
  }
  .clock { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 10px; }
  .clock-date { font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .clock-time { font-family: var(--font-num), monospace; color: var(--muted); font-variant-numeric: tabular-nums; }
  .sekki { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-top: 6px; }
  .chip {
    display: inline-flex;
    align-items: center;
    padding: 1px 11px;
    border-radius: 999px;
    border: 1.5px solid currentColor;
    font-weight: 700;
    font-size: 13px;
  }
  .chip[data-season="spring"] { color: var(--spring); }
  .chip[data-season="summer"] { color: var(--summer); }
  .chip[data-season="autumn"] { color: var(--autumn); }
  .chip[data-season="winter"] { color: var(--winter); }
  .sekki b { font-size: 15px; }
  .sekki .muted { font-size: 12px; }
  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px 14px;
    margin: 12px 0 0;
    padding-top: 12px;
    border-top: 1px solid var(--line);
  }
  .stats dt { font-size: 11.5px; color: var(--muted); }
  .stats dd {
    margin: 0;
    font-family: var(--font-num), var(--font-ui);
    font-size: 19px;
    font-weight: 500;
    line-height: 1.35;
    font-variant-numeric: tabular-nums;
  }
  .stats dd.when { font-size: 15px; }
  .stats .unit { font-size: 12px; color: var(--muted); margin-inline-start: 3px; font-weight: 400; font-family: var(--font-ui); }
  .stats small { display: block; font-family: var(--font-ui); font-size: 11.5px; color: var(--muted); font-weight: 400; }

  .moon-row { display: flex; align-items: center; gap: 12px; }
  #phase-canvas { width: 56px; height: 56px; flex: none; display: block; }
  .moon-name { font-size: 17px; font-weight: 700; }
  .moon-sub { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .inset canvas {
    display: block;
    width: 100%;
    aspect-ratio: 4 / 3;
    border-radius: 8px;
    border: 1px solid var(--line);
  }
  .caption { margin: 8px 0 0; font-size: 12.5px; line-height: 1.55; }
  #ro-place { font-variant-numeric: tabular-nums; }

  .controls { display: flex; flex-direction: column; gap: 14px; }
  .transport { display: flex; flex-wrap: wrap; gap: 8px; }
  button, select, input[type="date"], input[type="number"] {
    font: inherit;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 5px 11px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
    font-weight: 700;
    min-width: 6.5em;
  }
  button.link {
    border: 0;
    background: none;
    padding: 0;
    color: var(--accent);
    text-decoration: underline;
    text-underline-offset: 3px;
    font-size: 12px;
  }
  input[type="date"], input[type="number"] { font-family: var(--font-num), monospace; font-size: 13px; }
  input[type="date"] { flex: 1 1 9.5em; min-width: 0; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 8px; }
  .field-head label { font-weight: 700; }
  .field-head output { font-family: var(--font-num), var(--font-ui); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .field-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 10px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  input[type="range"] { width: 100%; margin: 0; accent-color: var(--accent); }
  .hint { margin: 0; font-size: 12px; color: var(--muted); }

  .toggles { border: 0; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
  .toggles legend { font-weight: 700; padding: 0; margin-bottom: 6px; }
  .toggle { position: relative; cursor: pointer; }
  .toggle input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .toggle span {
    display: inline-block;
    padding: 3px 11px;
    border: 1px solid var(--line);
    border-radius: 999px;
    font-size: 12.5px;
    color: var(--muted);
    user-select: none;
  }
  .toggle input:checked + span { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
  .toggle input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  .field-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .field-row label { font-weight: 700; margin-inline-end: auto; }

  .notes { padding-inline: 4px; }
  .notes p { margin: 0 0 8px; font-size: 12.5px; color: var(--muted); max-width: 65ch; }

  @media (max-width: 900px) {
    .app { grid-template-columns: minmax(0, 1fr); }
    .stage { height: auto; }
    .plan { flex: none; aspect-ratio: 1 / 1; max-height: 80vh; }
    h1 { font-size: 24px; }
  }
  @media (max-width: 640px) {
    .strip-controls, .side-foot { grid-template-columns: minmax(0, 1fr); }
    #strip-canvas { height: 220px; }
    .elev { height: 170px; }
  }
</style>

<div class="app">
  <header class="masthead">
    <div class="titles">
      <h1 data-i18n="title"></h1>
      <p data-i18n="subtitle"></p>
    </div>
    <div class="settings">
      <label class="setting"><span data-i18n="lang"></span>
        <select id="sel-lang"></select>
      </label>
      <label class="setting"><span data-i18n="place"></span>
        <select id="sel-place"></select>
      </label>
    </div>
  </header>

  <section class="custom-place" id="custom-place" hidden>
    <label><span data-i18n="lat"></span><input type="number" id="in-lat" min="-90" max="90" step="0.0001" inputmode="decimal"></label>
    <label><span data-i18n="lon"></span><input type="number" id="in-lon" min="-180" max="180" step="0.0001" inputmode="decimal"></label>
    <label><span data-i18n="tz"></span><select id="sel-tz"></select></label>
    <button type="button" id="btn-apply-place" class="primary" data-i18n="apply"></button>
    <p class="hint" data-i18n="latlonHint"></p>
    <p class="error" id="place-error" data-i18n="latlonError" hidden></p>
  </section>

  <main class="main-col">
    <div class="stage">
      <div class="plan">
        <canvas id="orbit-canvas" role="img" data-i18n-aria="ariaPlan"></canvas>
        <div class="stage-note">
          <span data-i18n="planNote"></span>
          <span class="badge" id="ecc-badge"></span>
          <span id="moon-note"></span>
          <span id="sector-note" data-i18n="sectorNote" hidden></span>
        </div>
        <div class="stage-foot" data-i18n="sizesNote"></div>
      </div>
      <div class="elev">
        <canvas id="side-canvas" role="img" data-i18n-aria="ariaElev"></canvas>
      </div>
    </div>

    <section class="view-card" aria-labelledby="side-title">
      <div class="view-head">
        <h2 id="side-title" data-i18n="sideTitle"></h2>
        <span class="badge" id="side-scale"></span>
        <span class="badge is-alert" id="side-eclipse" data-i18n="eclipseSeason" hidden></span>
      </div>
      <p class="view-sub" data-i18n="sideSub"></p>
      <div class="side-foot">
        <dl class="side-stats">
          <div><dt data-i18n="whereLabel"></dt><dd id="sd-where">—</dd></div>
          <div><dt data-i18n="vxLabel"></dt><dd><span id="sd-vx">—</span> <span data-i18n="kms"></span><small data-i18n="vxNote"></small></dd></div>
          <div><dt data-i18n="betaLabel"></dt><dd><span id="sd-beta">—</span><small id="sd-beta-side"></small></dd></div>
          <div><dt data-i18n="nodeLabel"></dt><dd><span id="sd-node">—</span>°<small data-i18n="nodeNote"></small></dd></div>
        </dl>
        <div class="field">
          <div class="field-head"><label for="in-tilt" data-i18n="tiltLabel"></label><output id="out-tilt" for="in-tilt"></output></div>
          <input type="range" id="in-tilt" min="1" max="10" step="1">
          <p class="hint" data-i18n="tiltHint"></p>
        </div>
      </div>
    </section>

    <section class="view-card" aria-labelledby="strip-title">
      <div class="view-head">
        <h2 id="strip-title" data-i18n="stripTitle"></h2>
        <span class="badge" id="strip-scale"></span>
        <span class="badge is-exaggerated" id="strip-mu" hidden></span>
      </div>
      <p class="view-sub" data-i18n="stripSub"></p>
      <canvas id="strip-canvas" role="img" data-i18n-aria="ariaStrip"></canvas>
      <div class="strip-controls">
        <div class="field">
          <div class="field-head"><label for="in-mu" data-i18n="muLabel"></label><output id="out-mu" for="in-mu"></output></div>
          <input type="range" id="in-mu" min="0" max="1000" step="1">
          <div class="presets" id="mu-presets">
            <button type="button" data-mu="1" data-i18n="presetReal"></button>
            <button type="button" data-mu="0.1" data-i18n="presetTenth"></button>
            <button type="button" data-mu="cusp" data-i18n="presetCusp"></button>
            <button type="button" data-mu="0.015" data-i18n="presetLoop"></button>
          </div>
          <div class="field-foot"><span id="strip-k"></span></div>
        </div>
        <div class="strip-options">
          <label class="check"><input type="checkbox" id="tg-aspect"><span data-i18n="aspectLabel"></span></label>
          <div class="field-row">
            <label for="sel-span" data-i18n="spanLabel"></label>
            <select id="sel-span">
              <option value="30" data-i18n="span1"></option>
              <option value="60" data-i18n="span2" selected></option>
              <option value="120" data-i18n="span4"></option>
            </select>
          </div>
        </div>
      </div>
      <p class="strip-note" data-i18n="stripNote"></p>
    </section>
  </main>

  <aside class="panel">
    <section class="card readout">
      <div class="clock">
        <span class="clock-date" id="ro-date">—</span>
        <span class="clock-time" id="ro-time">—</span>
      </div>
      <div class="sekki">
        <span class="chip" id="ro-season" data-season="autumn">—</span>
        <span><b id="ro-sekki"></b> <span class="muted" id="ro-sekki-range"></span></span>
      </div>
      <dl class="stats">
        <div>
          <dt data-i18n="distLabel"></dt>
          <dd><span id="ro-r">—</span><span class="unit" data-i18n="au"></span><small id="ro-rkm"></small></dd>
        </div>
        <div>
          <dt data-i18n="speedLabel"></dt>
          <dd><span id="ro-v">—</span><span class="unit" data-i18n="kms"></span><small id="ro-vkmh"></small></dd>
        </div>
        <div>
          <dt data-i18n="sunLonLabel"></dt>
          <dd><span id="ro-lon">—</span><span class="unit">°</span><small data-i18n="sunLonNote"></small></dd>
        </div>
        <div>
          <dt data-i18n="periLabel"></dt>

<script>
(() => {
  'use strict';

    { id: 'paris', lat: 48.8566, lon: 2.3522, tz: 'Europe/Paris' },
    { id: 'brasilia', lat: -15.7939, lon: -47.8828, tz: 'America/Sao_Paulo' },
    { id: 'dubai', lat: 25.2048, lon: 55.2708, tz: 'Asia/Dubai' },
    { id: 'sydney', lat: -33.8688, lon: 151.2093, tz: 'Australia/Sydney' },
    { id: 'nairobi', lat: -1.2921, lon: 36.8219, tz: 'Africa/Nairobi' },
    { id: 'reykjavik', lat: 64.1466, lon: -21.9426, tz: 'Atlantic/Reykjavik' },
    { id: 'capetown', lat: -33.9249, lon: 18.4241, tz: 'Africa/Johannesburg' },
    { id: 'mecca', lat: 21.3891, lon: 39.8579, tz: 'Asia/Riyadh' },
    { id: 'mexicocity', lat: 19.4326, lon: -99.1332, tz: 'America/Mexico_City' },
    { id: 'jakarta', lat: -6.2088, lon: 106.8456, tz: 'Asia/Jakarta' },
  ];
  const placeName = p => LOCALE_DATA[state.lang].places[p.id];
  // Time zones offered for a custom latitude/longitude (offset from UTC, in minutes)
  const TZ_OFFSETS = [-720, -660, -600, -570, -540, -480, -420, -360, -300, -240, -210, -180, -120, -60, 0,
    60, 120, 180, 210, 240, 270, 300, 330, 345, 360, 390, 420, 480, 525, 540, 570, 600, 630, 660, 720, 765, 780, 840];

  // ---- Constants -----------------------------------------------------------
  const DEG = Math.PI / 180;
  const TAU = Math.PI * 2;

  const GM_SUN = 1.32712440018e11;             // km^3 / s^2
  const OBLIQUITY = 23.4393 * DEG;             // obliquity of the ecliptic
  const PRECESSION = 1.39689;                  // general precession in longitude [deg / Julian century]
  const EARTH_RADIUS_KM = 6371;
  const MOON_MEAN_KM = 384400;
  const MOON_MAX_KM = 406800;
  const SYNODIC = 29.530589;                   // synodic month [days]
  const ELONG_RATE = 360 / SYNODIC;            // mean rate of change of the Moon's elongation [deg/day]
  const V_EARTH_MEAN = 29.78;                  // Earth's mean orbital speed [km/s]

    e: 0.01671123, eRate: -0.00004392,
    L: 100.46457166, LRate: 35999.37244981,    // mean longitude [deg], [deg/century]
    w: 102.93768193, wRate: 0.32327364,        // longitude of perihelion [deg], [deg/century]
  };

  const PERIOD = TAU / N_ANOM;                           // anomalistic year [days]

  // Main terms of Table 47.A in Meeus, Astronomical Algorithms
  // [D, M, M', F, ecliptic longitude (1e-6 deg), distance (1e-3 km)]
  const MOON_TERMS = [
    [0, 0, 1, 0, 6288774, -20905355],
    [2, 0, -1, 0, 1274027, -3699111],
    [2, 0, 0, 0, 658314, -2955968],
    [0, 0, 2, 0, 213618, -569925],
    [0, 1, 0, 0, -185116, 48888],
    [0, 0, 0, 2, -114332, -3149],
    [2, 0, -2, 0, 58793, 246158],
    [2, -1, -1, 0, 57066, -152138],
    [2, 0, 1, 0, 53322, -170733],
    [2, -1, 0, 0, 45758, -204586],
    [0, 1, -1, 0, -40923, -129620],
    [1, 0, 0, 0, -34720, 108743],
    [0, 1, 1, 0, -30383, 104755],
    [2, 0, 0, -2, 15327, 10321],
    [0, 0, 1, 2, -12528, 0],
    [0, 0, 1, -2, 10980, 79661],
    [4, 0, -1, 0, 10675, -34782],
    [0, 0, 3, 0, 10034, -23210],
    [4, 0, -2, 0, 8548, -21636],
    [2, 1, -1, 0, -7888, 24208],
    [2, 1, 0, 0, -6766, 30824],
    [1, 0, -1, 0, -5163, -8379],
    [1, 1, 0, 0, 4987, -16675],
    [2, -1, 1, 0, 4036, -12831],
    [2, 0, 2, 0, 3994, -10445],
    [4, 0, 0, 0, 3861, -11650],
    [2, 0, -3, 0, 3665, 14403],
    [0, 1, -2, 0, -2689, -7003],
  ];
  // Main terms of Table 47.B [D, M, M', F, ecliptic latitude (1e-6 deg)]
  const MOON_LAT_TERMS = [
    [0, 0, 0, 1, 5128122],
    [0, 0, 1, 1, 280602],
    [0, 0, 1, -1, 277693],
    [2, 0, 0, -1, 173237],
    [2, 0, -1, 1, 55413],
    [2, 0, -1, -1, 46271],
    [2, 0, 0, 1, 32573],
    [0, 0, 2, 1, 17198],
    [2, 0, 1, -1, 9266],
    [0, 0, 2, -1, 8822],
    [2, -1, 0, -1, 8216],
    [2, 0, -2, -1, 4324],
    [2, 0, 1, 1, 4200],
    [2, 1, 0, -1, -3359],
  ];
  const ECLIPSE_LIMIT = 17;                    // eclipse season: Sun within this angle of a lunar node [deg]

  const E_MAX = 0.9;
  const SPEED_MIN = 1 / 24, SPEED_MAX = 60;    // [days/s]
  const MU_MIN = 0.01;

  // ---- State -----------------------------------------------------------------
  const STORE_KEY = 'earth-moon-orbits:settings';
  const saved = (() => {
    try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch { return {}; }
  })();
  const hashLang = (() => {
    try { return decodeURIComponent(location.hash.slice(1)); } catch { return ''; }
  })();
  // The first of the browser's preferred languages that has a language file. Tags are compared by
  // language and script after filling in the likely script, so zh-TW finds zh-Hant, zh-CN finds
  // zh-Hans and pt-PT finds pt.
  function browserLang() {
    const key = tag => {
      try { const l = new Intl.Locale(tag).maximize(); return `${l.language}-${l.script}`; } catch { return ''; }
    };
    const ours = new Map(LANGS.map(code => [key(code), code]));
    for (const tag of navigator.languages?.length ? navigator.languages : [navigator.language]) {
      const code = ours.get(key(tag));
      if (code) return code;
    }
    return null;
  }
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const mod = (a, n) => ((a % n) + n) % n;
  const cent = t => t / 36525;
  const daysFromMs = ms => (ms - J2000_MS) / DAY_MS;
  const msFromDays = t => J2000_MS + t * DAY_MS;
  const pad = n => String(n).padStart(2, '0');

  const validCustom = c => c && Number.isFinite(c.lat) && Number.isFinite(c.lon) && Number.isFinite(c.tz)
    && Math.abs(c.lat) <= 90 && Math.abs(c.lon) <= 180;
  const state = {
    t: daysFromMs(Date.now()),
    playing: !reduceMotion,
    speed: 0.5,               // days per second (12 h/s): slow enough to follow the Moon across the sky
    eOverride: null,          // null = use the actual eccentricity
    trailStart: 0,
    trailLen: 365.25,
    mu: 1,                    // factor applied to Earth's orbital speed in the straightened-orbit view
    trueAspect: false,
    stripDays: 60,
    tilt: 6,                  // factor exaggerating the Moon's orbital inclination in the edge-on view
    lang: LANGS.includes(hashLang) ? hashLang : LANGS.includes(saved.lang) ? saved.lang : browserLang() || FALLBACK_LANG,
    custom: validCustom(saved.custom) ? saved.custom : null,
    placeId: 'london',
    show: { moon: true, orbit: true, trail: true, months: true, sekki: false, sectors: false, velocity: false, rings: false },
  };
  if (saved.placeId === 'custom' ? state.custom : PLACES.some(p => p.id === saved.placeId)) state.placeId = saved.placeId;
  state.trailStart = state.t - 90;
  let dirty = true;

  function saveSettings() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({ lang: state.lang, placeId: state.placeId, custom: state.custom }));
    } catch { /* storage unavailable: carry on without saving */ }
  }

  // ---- Translation and formatting --------------------------------------------
  // Look up a string. A string that varies with a count gives one form per plural category of the
  // language ("zero", "one", "two", "few", "many", "other"); `category` picks the form.
  function t(key, vars, category = 'other') {
    let s = DICT[state.lang][key] ?? DICT[FALLBACK_LANG][key];
    if (s && typeof s === 'object' && !Array.isArray(s)) s = s[category] ?? s.other;
    if (typeof s === 'string' && vars) s = s.replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? '');
    return s;
  }
  const nfCache = new Map();
  function nf(x, digits = 0) {
    const key = state.lang + ':' + digits;
    let f = nfCache.get(key);
    if (!f) {
      f = new Intl.NumberFormat(LOCALES[state.lang], { minimumFractionDigits: digits, maximumFractionDigits: digits });
      nfCache.set(key, f);
    }
    return f.format(x);
  }
  // A string containing a count: {n} is `value` formatted with `digits` decimals, and the plural
  // form is the one the language uses for that formatted number
  const pluralRules = new Map();
  function tc(key, value, digits = 0, vars = {}) {
    const id = state.lang + ':' + digits;
    let rules = pluralRules.get(id);
    if (!rules) {
      rules = new Intl.PluralRules(LOCALES[state.lang], { minimumFractionDigits: digits, maximumFractionDigits: digits });
      pluralRules.set(id, rules);
    }
    return t(key, { ...vars, n: nf(value, digits) }, rules.select(value));
  }
  const signed = (x, digits) => `${x >= 0 ? '+' : '−'}${nf(Math.abs(x), digits)}`;
  const auDigits = L => Number.isInteger(L) ? 0 : Number.isInteger(Math.round(L * 1e6) / 1e5) ? 1 : 2;

  // How a language writes large distances comes from meta.largeNumbers in its language file:
  // "myriad" groups by 10^4 (億・万), "indian" uses lakh and crore, anything else millions
  function fmtKm(km) {
    const big = langData().meta.largeNumbers || {};
    if (big.style === 'myriad') {
      const [oku, man] = big.units, sep = big.separator || '';
      const m = Math.round(km / 1e4);
      if (m >= 10000) {
        const o = Math.floor(m / 10000), r = m % 10000;
        return `${o}${oku}${r ? sep + r + man : ''} km`;
      }
      return `${m}${man} km`;
    }
    if (big.style === 'indian') return km >= 1e7 ? tc('kmCrore', km / 1e7, 2) : tc('kmLakh', km / 1e5, 1);
    return tc('kmMillion', km / 1e6, 1);
  }

  // ---- Observing location and time zone --------------------------------------
  let place = null;
  function refreshPlace() {
    if (state.placeId === 'custom' && state.custom) {
      const c = state.custom;
      place = { lat: c.lat, lon: c.lon, tz: c.tz, name: `${nf(c.lat, 2)}°, ${nf(c.lon, 2)}°` };
    } else {
      const p = PLACES.find(x => x.id === state.placeId) || PLACES.find(x => x.id === 'london');
      place = { lat: p.lat, lon: p.lon, tz: p.tz, name: placeName(p) };
    }
    place.short = place.name.replace(/\s*[（(].*$/, '');
    yearCache = { key: '' };
  }

  // Offset from UTC [min]. Daylight-saving changes happen on the hour, so the result is cached per
  // hour
  const offsetCache = new Map();
  const tzFormatters = new Map();
  function tzOffsetMin(ms) {
    const tz = place.tz;
    if (typeof tz === 'number') return tz;
    const key = tz + '|' + Math.floor(ms / 3600000);
    const hit = offsetCache.get(key);
    if (hit !== undefined) return hit;
    let f = tzFormatters.get(tz);
    if (!f) {
      f = new Intl.DateTimeFormat('en-US', { timeZone: tz, hourCycle: 'h23', year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric' });
      tzFormatters.set(tz, f);
    }
    const base = Math.floor(ms / 60000) * 60000;
    const p = {};
    for (const x of f.formatToParts(new Date(base))) p[x.type] = x.value;
    const asUtc = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour % 24, +p.minute);
    const v = Math.round((asUtc - base) / 60000);

    offsetCache.set(key, v);
    return v;
